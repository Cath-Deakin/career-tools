<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Widget</title>
    
    <link rel="stylesheet" href="https://github.com/Cath-Deakin/Career-Master-Code/blob/main/Universal-Widget">

    <style>
        :root {
            --primary: #6366f1;
            --primary-text: #ffffff;
            --bg: #ffffff;
            --bg-text: #1e293b;
            --page-bg: #f8fafc;
        }
        body { 
            background-color: var(--page-bg); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="careertech-widget-container" data-widget-type="flashcards"></div>

    <script>
        window.widgetData = [
    {
        "tag": "Leadership",
        "question": "Tell us about a time you've demonstrated effective leadership.",
        "s": "Team morale was low.",
        "t": "I needed to get the group back on track.",
        "a": "I organised a meeting.",
        "r": "We finished early.",
        "r2": "I learned to listen."
    }
];
    </script>

    <script src="https://github.com/Cath-Deakin/Career-Master-Code/blob/main/Universal-Widget"></script>

</body>
</html>
